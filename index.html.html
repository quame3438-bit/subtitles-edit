<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube 字幕编辑器</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#222;--muted:#777;--line:#e8e8ea;--btn:#111}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
.wrap{max-width:860px;margin:auto;padding:16px 12px 40px}
h1{font-size:26px;margin:8px 0 14px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.filebtn{border:0;border-radius:12px;padding:11px 14px;background:var(--btn);color:#fff;font-size:15px;cursor:pointer}
button.secondary,.filebtn.secondary{background:#eee;color:#222}
button.danger{background:#b42318}
input[type=file]{display:none}
input[type=text],input[type=number],textarea{
 width:100%;border:1px solid #d7d7db;border-radius:10px;padding:10px 11px;font-size:15px;background:#fff
}
.urlrow{display:grid;grid-template-columns:1fr auto;gap:8px}
video,audio{width:100%;border-radius:12px;background:#000;margin-top:12px}
.ytwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:12px}
.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.help{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.status{font-size:14px;color:var(--muted);margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.subtitlebox{font-size:22px;font-weight:600;text-align:center;min-height:62px;padding:14px 8px;white-space:pre-wrap}
.list{display:grid;gap:8px;margin-top:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}
.item.active{outline:2px solid #111}
.itemtop{display:grid;grid-template-columns:90px 90px 1fr;gap:8px;align-items:start}
.itemnum{font-weight:700;padding-top:10px}
.item textarea{min-height:64px;resize:vertical}
.timewrap{display:grid;grid-template-columns:1fr;gap:6px}
.timeinput{font-variant-numeric:tabular-nums;text-align:center}
.timeadjust{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.timeadjust button{padding:8px 0;font-size:18px;line-height:1;background:#eee;color:#222}
.timeadjust .stepnote{text-align:center;font-size:12px;color:var(--muted)}
.itemactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.itemactions button{padding:8px 10px;font-size:13px}
.small{font-size:13px;color:var(--muted)}
@media(max-width:640px){
 .urlrow{grid-template-columns:1fr}
 .itemtop{grid-template-columns:1fr 1fr}
 .itemtop .textcell{grid-column:1/-1}
 h1{font-size:23px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>YouTube 字幕编辑器</h1>

  <div class="card">
    <b>1. 加载视频</b>
    <div class="urlrow" style="margin-top:10px">
      <input id="videoUrl" type="text" placeholder="粘贴 YouTube / Shorts 链接，也支持 MP4 等直链">
      <button id="loadUrlBtn">加载视频</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="filebtn secondary">＋ 选择本地视频<input id="videoFile" type="file" accept="video/*,audio/*"></label>
    </div>
    <div id="playerBox"></div>
    <div id="videoStatus" class="status">尚未加载视频</div>
    <div class="help">
      优先支持 YouTube 普通视频、Shorts、youtu.be 链接；也支持浏览器可直接播放的 MP4、M4V、WebM、m3u8 等直链。
    </div>
  </div>

  <div class="card">
    <b>2. 导入字幕</b>
    <div class="row" style="margin-top:10px">
      <label class="filebtn">＋ 导入字幕<input id="srtFile" type="file" accept="*/*"></label>
      <button class="secondary" id="newSubBtn">新建空字幕</button>
      <button class="secondary" id="addSubBtn">＋ 添加一条</button>
    </div>
    <div id="subStatus" class="status">尚未导入字幕</div>
  </div>

  <div class="card">
    <div class="subtitlebox" id="currentSubtitle">字幕会显示在这里</div>
    <div class="toolbar" style="margin-top:10px">
      <button class="secondary" id="rewindBtn">⏪ 快退</button>
      <button id="togglePlayBtn">▶️ 播放</button>
      <button class="secondary" id="forwardBtn">快进 ⏩</button>
    </div>

    <div class="row" style="margin-top:10px">
      <label style="font-size:14px">快退/快进时间：
        <select id="seekStep" style="margin-left:6px;padding:8px;border:1px solid #ddd;border-radius:10px;background:white"></select>
        秒
      </label>
    </div>

    <div class="toolbar" style="margin-top:10px">
      <button class="secondary" id="prevBtn">上一句</button>
      <button id="playBtn">播放本句</button>
      <button class="secondary" id="nextBtn">下一句</button>
    </div>

    <div class="toolbar" style="margin-top:10px">
      <button class="secondary" id="syncStartBtn">当前时间设为开始</button>
      <button class="secondary" id="syncEndBtn">当前时间设为结束</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label style="font-size:14px">播放速度：
        <select id="speed" style="margin-left:6px;padding:8px;border:1px solid #ddd;border-radius:10px;background:white">
          <option value="0.2">0.2×</option>
          <option value="0.4">0.4×</option>
          <option value="0.5">0.5×</option>
          <option value="0.8">0.8×</option>
          <option value="1" selected>1.0×</option>
          <option value="1.2">1.2×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2.0×</option>
        </select>
      </label>
    </div>
    <div class="small" style="margin-top:6px">YouTube 实际可用倍速由当前视频决定；若不支持所选倍速，会自动使用最接近的可用速度。</div>
    <div class="small" id="currentMeta" style="margin-top:8px">0 / 0</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>3. 编辑字幕</b>
      <button id="exportBtn">导出 SRT</button>
    </div>
    <div class="help">时间精确到毫秒，格式：00:00:12,345。开始时间和结束时间都可以用 ＋ / － 微调。</div>
    <div class="row" style="margin-top:10px">
      <label style="font-size:14px">每次加减：
        <select id="msStep" style="margin-left:6px;padding:8px;border:1px solid #ddd;border-radius:10px;background:white"></select>
        毫秒
      </label>
    </div>
    <div id="subtitleList" class="list"></div>
  </div>
</div>

<script>
let media = null;
let ytPlayer = null;
let ytReady = false;
let ytMode = false;
let ytPendingId = null;
let ytPoll = null;
let localUrl = null;
let subs = [];
let current = 0;

const $ = s => document.querySelector(s);

function esc(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function stopYTPoll(){
  if(ytPoll){ clearInterval(ytPoll); ytPoll=null; }
}

function destroyYouTube(){
  stopYTPoll();
  if(ytPlayer && typeof ytPlayer.destroy==="function"){
    try{ ytPlayer.destroy(); }catch(e){}
  }
  ytPlayer=null;
  ytReady=false;
  ytMode=false;
}

function setupMedia(src, isAudio=false){
  destroyYouTube();
  if(localUrl && src !== localUrl){ try{URL.revokeObjectURL(localUrl)}catch(e){} localUrl=null; }
  $("#playerBox").innerHTML = isAudio
    ? `<audio id="media" controls src="${esc(src)}"></audio>`
    : `<video id="media" controls playsinline src="${esc(src)}"></video>`;
  media = $("#media");
  media.playbackRate = Number($("#speed")?.value || 1);
  $("#videoStatus").textContent = "已加载媒体";
  media.addEventListener("error",()=>{
    $("#videoStatus").textContent = "加载失败：这个地址可能不是视频直链，或网站禁止跨站播放。";
  });
  media.addEventListener("timeupdate", highlightByTime);
  media.addEventListener("play",()=>{ const b=$("#togglePlayBtn"); if(b) b.textContent="⏸ 暂停"; });
  media.addEventListener("pause",()=>{ const b=$("#togglePlayBtn"); if(b) b.textContent="▶️ 播放"; });
}

function extractYouTubeId(u){
  try{
    const url=new URL(u);
    const host=url.hostname.replace(/^www\./,"");
    if(host==="youtu.be"){
      return url.pathname.split("/").filter(Boolean)[0] || null;
    }
    if(host.endsWith("youtube.com")){
      if(url.pathname.startsWith("/shorts/")) return url.pathname.split("/")[2] || null;
      if(url.pathname.startsWith("/embed/")) return url.pathname.split("/")[2] || null;
      const v=url.searchParams.get("v");
      if(v) return v;
    }
  }catch(e){}
  if(/^[A-Za-z0-9_-]{11}$/.test(u.trim())) return u.trim();
  return null;
}

function ensureYouTubeAPI(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  return new Promise(resolve=>{
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=function(){
      if(typeof prev==="function") try{prev();}catch(e){}
      resolve();
    };
    if(!document.querySelector('script[src="https://www.youtube.com/iframe_api"]')){
      const tag=document.createElement("script");
      tag.src="https://www.youtube.com/iframe_api";
      document.head.appendChild(tag);
    }
    const timer=setInterval(()=>{
      if(window.YT && window.YT.Player){
        clearInterval(timer);
        resolve();
      }
    },200);
  });
}

async function setupYouTube(videoId){
  media=null;
  destroyYouTube();
  ytMode=true;
  ytPendingId=videoId;
  if(localUrl){ try{URL.revokeObjectURL(localUrl)}catch(e){} localUrl=null; }
  $("#playerBox").innerHTML=`<div class="ytwrap"><div id="ytPlayer"></div></div>`;
  $("#videoStatus").textContent="正在加载 YouTube…";

  await ensureYouTubeAPI();
  if(!ytMode || ytPendingId!==videoId) return;

  ytPlayer=new YT.Player("ytPlayer",{
    videoId,
    playerVars:{
      playsinline:1,
      rel:0
    },
    events:{
      onReady:(e)=>{
        ytReady=true;
        $("#videoStatus").textContent="YouTube 已加载";
        applySelectedSpeed();
        startYTPoll();
      },
      onStateChange:(e)=>{
        const b=$("#togglePlayBtn");
        if(!b) return;
        b.textContent = e.data===YT.PlayerState.PLAYING ? "⏸ 暂停" : "▶️ 播放";
      },
      onError:()=>{
        $("#videoStatus").textContent="YouTube 播放失败：该视频可能禁止嵌入、受地区/年龄限制，或链接无效。";
      }
    }
  });
}

function startYTPoll(){
  stopYTPoll();
  ytPoll=setInterval(()=>{
    if(!ytMode || !ytReady || !ytPlayer) return;
    highlightByTime();
  },100);
}

$("#loadUrlBtn").onclick = ()=>{
  const u = $("#videoUrl").value.trim();
  if(!u){ alert("请先粘贴视频网址"); return; }
  const ytId=extractYouTubeId(u);
  if(ytId){
    setupYouTube(ytId);
    return;
  }
  setupMedia(u, /\.(mp3|m4a|aac|wav)(\?|#|$)/i.test(u));
};

$("#videoFile").onchange = e=>{
  destroyYouTube();
  const f = e.target.files[0];
  if(!f) return;
  if(localUrl) URL.revokeObjectURL(localUrl);
  localUrl = URL.createObjectURL(f);
  setupMedia(localUrl, f.type.startsWith("audio/"));
  $("#videoStatus").textContent = "已加载本地文件：" + f.name;
};

function parseTimecode(t){
  const m = t.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/);
  if(!m) return 0;
  return +m[1]*3600 + +m[2]*60 + +m[3] + +("0."+m[4]);
}
function formatTime(sec){
  sec = Math.max(0, Number(sec)||0);
  let totalMs = Math.round(sec*1000);
  const h = Math.floor(totalMs/3600000);
  totalMs -= h*3600000;
  const m = Math.floor(totalMs/60000);
  totalMs -= m*60000;
  const s = Math.floor(totalMs/1000);
  const ms = totalMs - s*1000;
  const pad=(n,l=2)=>String(n).padStart(l,"0");
  return `${pad(h)}:${pad(m)}:${pad(s)},${pad(ms,3)}`;
}
function parseEditableTime(v){
  v=String(v||"").trim();
  if(/^\d+(\.\d+)?$/.test(v)) return Math.max(0, Number(v));
  const m=v.match(/^(\d+):(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
  if(!m) return null;
  const ms=String(m[4]).padEnd(3,"0").slice(0,3);
  return (+m[1])*3600+(+m[2])*60+(+m[3])+(+ms)/1000;
}
function parseSRT(text){
  return text.replace(/\r/g,"").trim().split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n");
    const idx=lines.findIndex(x=>x.includes("-->"));
    if(idx<0) return null;
    const [a,b]=lines[idx].split("-->");
    return {start:parseTimecode(a),end:parseTimecode(b),text:lines.slice(idx+1).join("\n")};
  }).filter(Boolean);
}

$("#srtFile").onchange = async e=>{
  const input=e.target;
  const f=input.files && input.files[0];
  if(!f){
    $("#subStatus").textContent="没有选择字幕文件";
    return;
  }

  $("#subStatus").textContent="正在读取字幕…";

  try{
    const buf=await f.arrayBuffer();

    // UTF-8 first; if replacement characters appear, try common Chinese encodings.
    let text=new TextDecoder("utf-8").decode(buf);
    if(text.includes("�")){
      try{
        const gb=new TextDecoder("gb18030").decode(buf);
        if(!gb.includes("�")) text=gb;
      }catch(err){}
    }

    // Remove BOM and normalize line endings.
    text=text.replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n");

    let parsed=parseSRT(text);

    // Simple WebVTT compatibility.
    if(!parsed.length && /^\s*WEBVTT/i.test(text)){
      const vtt=text.replace(/^\s*WEBVTT[^\n]*\n+/i,"")
                    .replace(/(\d{2}:\d{2}:\d{2})\.(\d{3})/g,"$1,$2")
                    .replace(/(\d{2}:\d{2})\.(\d{3})/g,"00:$1,$2");
      parsed=parseSRT(vtt);
    }

    if(!parsed.length){
      $("#subStatus").textContent="没有识别到字幕。请确认文件是 SRT/VTT 格式。";
      alert("没有识别到字幕内容。\n请确认你选择的是 .srt 或 .vtt 字幕文件。");
      input.value="";
      return;
    }

    subs=parsed;
    current=0;
    $("#subStatus").textContent=`已导入 ${subs.length} 条字幕：${f.name}`;
    render();

    // Allow selecting the same file again later.
    input.value="";
  }catch(err){
    console.error(err);
    $("#subStatus").textContent="字幕读取失败，请重新选择文件";
    alert("字幕读取失败，请重新选择一次。");
    input.value="";
  }
};

$("#newSubBtn").onclick=()=>{
  subs=[];
  current=0;
  $("#subStatus").textContent="已新建空字幕";
  render();
};

$("#addSubBtn").onclick=()=>{
  let start=(media || (ytMode&&ytReady)) ? playerCurrentTime() : 0;
  let end=start+2;
  subs.push({start,end,text:""});
  current=subs.length-1;
  render();
  setTimeout(()=>document.querySelector(`.item[data-i="${current}"] textarea`)?.focus(),50);
};

function render(){
  $("#currentMeta").textContent = subs.length ? `${current+1} / ${subs.length}` : "0 / 0";
  $("#currentSubtitle").textContent = subs[current]?.text || "字幕会显示在这里";
  $("#subtitleList").innerHTML = subs.map((s,i)=>`
    <div class="item ${i===current?'active':''}" data-i="${i}">
      <div class="itemtop">
        <div class="itemnum">第 ${i+1} 条</div>
        <div class="timewrap">
          <div class="small">开始时间</div>
          <input class="timeinput" type="text" value="${formatTime(s.start)}" data-timefield="start" data-i="${i}">
          <div class="timeadjust">
            <button type="button" onclick="adjustTime(${i},'start',-1)">－</button>
            <div class="stepnote">按所选毫秒微调</div>
            <button type="button" onclick="adjustTime(${i},'start',1)">＋</button>
          </div>
        </div>
        <div class="textcell"><div class="small">字幕文字</div><textarea data-field="text" data-i="${i}">${esc(s.text)}</textarea></div>
        <div class="timewrap">
          <div class="small">结束时间</div>
          <input class="timeinput" type="text" value="${formatTime(s.end)}" data-timefield="end" data-i="${i}">
          <div class="timeadjust">
            <button type="button" onclick="adjustTime(${i},'end',-1)">－</button>
            <div class="stepnote">按所选毫秒微调</div>
            <button type="button" onclick="adjustTime(${i},'end',1)">＋</button>
          </div>
        </div>
      </div>
      <div class="itemactions">
        <button class="secondary" onclick="go(${i})">定位</button>
        <button class="secondary" onclick="setStart(${i})">当前时间→开始</button>
        <button class="secondary" onclick="setEnd(${i})">当前时间→结束</button>
        <button class="secondary" onclick="moveUp(${i})">上移</button>
        <button class="secondary" onclick="moveDown(${i})">下移</button>
        <button class="danger" onclick="removeSub(${i})">删除</button>
      </div>
    </div>`).join("");

  document.querySelectorAll("[data-field='text']").forEach(el=>{
    el.oninput=()=>{
      const i=+el.dataset.i;
      subs[i].text=el.value;
      if(i===current) $("#currentSubtitle").textContent=subs[i].text;
    };
  });
  document.querySelectorAll("[data-timefield]").forEach(el=>{
    const commit=()=>{
      const i=+el.dataset.i, f=el.dataset.timefield;
      const val=parseEditableTime(el.value);
      if(val===null){ el.value=formatTime(subs[i][f]); return; }
      subs[i][f]=Math.round(val*1000)/1000;
      el.value=formatTime(subs[i][f]);
    };
    el.onchange=commit;
    el.onblur=commit;
  });
}

window.go = function(i){
  if(!subs.length)return;
  current=Math.max(0,Math.min(subs.length-1,i));
  playerSeek(subs[current].start);
  render();
};
window.setStart = function(i){
  if(media || (ytMode&&ytReady)){subs[i].start=playerCurrentTime();current=i;render();}
};
window.setEnd = function(i){
  if(media || (ytMode&&ytReady)){subs[i].end=playerCurrentTime();current=i;render();}
};
window.removeSub = function(i){ subs.splice(i,1); current=Math.min(current,Math.max(0,subs.length-1)); render(); };
window.moveUp = function(i){ if(i<=0)return; [subs[i-1],subs[i]]=[subs[i],subs[i-1]]; current=i-1; render(); };
window.moveDown = function(i){ if(i>=subs.length-1)return; [subs[i+1],subs[i]]=[subs[i],subs[i+1]]; current=i+1; render(); };

window.adjustTime = function(i, field, dir){
  const stepMs = Math.max(1, Math.min(100, Number($("#msStep").value)||10));
  subs[i][field] = Math.max(0, Math.round((subs[i][field]*1000 + dir*stepMs))/1000);
  current=i;
  render();
};

const msStep=$("#msStep");
for(let n=1;n<=100;n++){
  const o=document.createElement("option");
  o.value=n;
  o.textContent=n;
  if(n===10) o.selected=true;
  msStep.appendChild(o);
}


function playerCurrentTime(){
  if(ytMode && ytReady && ytPlayer && typeof ytPlayer.getCurrentTime==="function"){
    return Number(ytPlayer.getCurrentTime())||0;
  }
  return media ? (Number(media.currentTime)||0) : 0;
}
function playerSeek(t){
  t=Math.max(0,Number(t)||0);
  if(ytMode && ytReady && ytPlayer){
    ytPlayer.seekTo(t,true);
    return;
  }
  if(media) media.currentTime=t;
}
function playerPlay(){
  if(ytMode && ytReady && ytPlayer){ ytPlayer.playVideo(); return; }
  if(media) media.play();
}
function playerPause(){
  if(ytMode && ytReady && ytPlayer){ ytPlayer.pauseVideo(); return; }
  if(media) media.pause();
}
function playerIsPaused(){
  if(ytMode && ytReady && ytPlayer && window.YT){
    return ytPlayer.getPlayerState()!==YT.PlayerState.PLAYING;
  }
  return media ? media.paused : true;
}
function playerDuration(){
  if(ytMode && ytReady && ytPlayer && typeof ytPlayer.getDuration==="function"){
    return Number(ytPlayer.getDuration())||NaN;
  }
  return media ? media.duration : NaN;
}
function applySelectedSpeed(){
  const rate=Number($("#speed").value)||1;
  if(ytMode && ytReady && ytPlayer && typeof ytPlayer.setPlaybackRate==="function"){
    const available = typeof ytPlayer.getAvailablePlaybackRates==="function"
      ? ytPlayer.getAvailablePlaybackRates()
      : [];
    if(available && available.length){
      let nearest=available.reduce((a,b)=>Math.abs(b-rate)<Math.abs(a-rate)?b:a,available[0]);
      ytPlayer.setPlaybackRate(nearest);
      if(Math.abs(nearest-rate)>.001){
        $("#videoStatus").textContent=`YouTube 此视频不支持 ${rate}×，已使用 ${nearest}×`;
      }
    }else{
      ytPlayer.setPlaybackRate(rate);
    }
    return;
  }
  if(media) media.playbackRate=rate;
}

$("#prevBtn").onclick=()=>{ if(subs.length) go(current-1); };
$("#nextBtn").onclick=()=>{ if(subs.length) go(current+1); };
$("#playBtn").onclick=()=>{
  if(!subs.length || (!media && !(ytMode&&ytReady)))return;
  playerSeek(subs[current].start);
  playerPlay();
};
$("#syncStartBtn").onclick=()=>{
  if(subs.length&&(media||(ytMode&&ytReady))){subs[current].start=playerCurrentTime();render();}
};
$("#syncEndBtn").onclick=()=>{
  if(subs.length&&(media||(ytMode&&ytReady))){subs[current].end=playerCurrentTime();render();}
};

function highlightByTime(){
  if((!media && !(ytMode&&ytReady))||!subs.length)return;
  const t=playerCurrentTime();
  const i=subs.findIndex(s=>t>=s.start && t<=s.end);
  if(i>=0 && i!==current){ current=i; render(); }
}

$("#exportBtn").onclick=()=>{
  if(!subs.length){alert("现在没有字幕可以导出");return;}
  const text=subs.map((s,i)=>`${i+1}\n${formatTime(s.start)} --> ${formatTime(s.end)}\n${s.text.trim()}\n`).join("\n");
  const blob=new Blob([text],{type:"application/x-subrip;charset=utf-8"});
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=u;a.download="修改后的字幕.srt";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};

const seekStep=$("#seekStep");
for(let n=1;n<=10;n++){
  const o=document.createElement("option");
  o.value=n;
  o.textContent=n;
  if(n===5) o.selected=true;
  seekStep.appendChild(o);
}

$("#rewindBtn").onclick=()=>{
  if(!media && !(ytMode&&ytReady)) return;
  const step=Number($("#seekStep").value)||5;
  playerSeek(playerCurrentTime()-step);
};

$("#forwardBtn").onclick=()=>{
  if(!media && !(ytMode&&ytReady)) return;
  const step=Number($("#seekStep").value)||5;
  const target=playerCurrentTime()+step;
  const d=playerDuration();
  playerSeek(Number.isFinite(d)&&d>0 ? Math.min(d,target) : target);
};

$("#togglePlayBtn").onclick=()=>{
  if(!media && !(ytMode&&ytReady)) return;
  if(playerIsPaused()){
    playerPlay();
    $("#togglePlayBtn").textContent="⏸ 暂停";
  }else{
    playerPause();
    $("#togglePlayBtn").textContent="▶️ 播放";
  }
};

$("#speed").onchange=applySelectedSpeed;

render();
</script>
</body>
</html>
