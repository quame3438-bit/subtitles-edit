<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube 嵌入独立测试</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;max-width:760px;margin:20px auto;padding:0 14px;background:#f6f6f6;color:#222}section{background:white;padding:16px;border-radius:12px;margin:12px 0}input,button,select{font-size:16px;padding:12px;border-radius:8px;border:1px solid #ccc}input{width:100%;box-sizing:border-box}button{background:#111;color:white;margin:6px 4px 6px 0}.player{aspect-ratio:16/9;background:black;margin-top:12px}.player iframe{width:100%;height:100%;border:0}pre{white-space:pre-wrap;word-break:break-word;font-size:13px;background:#eee;padding:10px;border-radius:8px}a{color:#1765c1}</style></head><body><h2>YouTube 嵌入独立测试</h2><p>此页面不含字幕编辑、登录或其他功能，仅测试 YouTube 是否允许在 GitHub Pages 内嵌播放。</p><section><label for="url">粘贴同一个 YouTube 视频网址：</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..."><p><button id="standard">① 标准嵌入</button><button id="privacy">② 隐私增强嵌入</button></p><a id="external" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">③ 在 YouTube 原网页打开</a><div class="player" id="holder"></div><p id="status">等待加载</p></section><section><b>测试记录</b><pre id="log"></pre><button id="copy">复制记录</button></section><script>const $=id=>document.getElementById(id);function log(s){$('log').textContent+='['+new Date().toLocaleTimeString()+'] '+s+'\n'}function idOf(s){s=s.trim();if(/^[\w-]{11}$/.test(s))return s;try{let u=new URL(s),h=u.hostname.replace(/^www\./,'');if(h==='youtu.be')return u.pathname.split('/')[1];if(h==='youtube.com'||h==='m.youtube.com'||h==='music.youtube.com'||h==='youtube-nocookie.com'){if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/embed/')||u.pathname.startsWith('/live/'))return u.pathname.split('/')[2];return u.searchParams.get('v')}}catch(e){}return null}function load(privacy){let id=idOf($('url').value);if(!id){$('status').textContent='无法识别视频 ID';return}let domain=privacy?'www.youtube-nocookie.com':'www.youtube.com';let origin=location.protocol==='https:'?location.origin:'';let params=new URLSearchParams({playsinline:'1',controls:'1',enablejsapi:'1'});if(origin)params.set('origin',origin);let iframe=document.createElement('iframe');iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';iframe.src='https://'+domain+'/embed/'+encodeURIComponent(id)+'?'+params.toString();$('holder').replaceChildren(iframe);$('external').href='https://www.youtube.com/watch?v='+encodeURIComponent(id);$('status').textContent='已加载'+(privacy?'隐私增强':'标准')+'播放器，请点击视频中的播放按钮';log('模式：'+(privacy?'隐私增强':'标准')+'；视频ID：'+id+'；页面来源：'+location.origin+'；请记录点击播放后是否要求登录或出现错误150。')} $('standard').onclick=()=>load(false);$('privacy').onclick=()=>load(true);$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('log').textContent);$('status').textContent='记录已复制'}catch(e){$('status').textContent='复制失败，可手动选择文字'}};log('浏览器：'+navigator.userAgent);log('页面地址：'+location.href);</script></body></html>
