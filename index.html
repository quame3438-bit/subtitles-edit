<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>YouTube 字幕编辑器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:auto;padding:14px 12px 40px}
h1{font-size:24px;margin:8px 0 4px}
.version{font-size:12px;color:#888;margin-bottom:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.controls button{flex:1;min-width:88px}
button,.filebtn{border:0;border-radius:12px;padding:11px 13px;background:#111;color:#fff;font-size:15px;text-align:center}
button.secondary,.filebtn.secondary{background:#eee;color:#222}
button:disabled{opacity:.45}
input[type=file]{display:none}
input[type=text],textarea,select{width:100%;border:1px solid #d7d7db;border-radius:10px;padding:10px;font-size:15px;background:#fff}
.urlrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.ytbox{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:12px}
#player{width:100%;height:100%}
.small{font-size:13px;color:#777}
.subtitle{font-size:22px;font-weight:600;text-align:center;min-height:58px;padding:12px 8px;white-space:pre-wrap}
.item{border:1px solid #e6e6e8;border-radius:14px;padding:10px;margin-top:8px}
.item.active{outline:2px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid textarea{grid-column:1/-1;min-height:72px;resize:vertical}
.timebox{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.timebox button{padding:9px 0;background:#eee;color:#222}
.timeinput{font-variant-numeric:tabular-nums;text-align:center}
.status{margin-top:8px;font-size:13px;color:#777}
.wave-wrap{margin-top:12px}
.wave-stage{
  position:relative;
  height:90px;
  border:1px solid #e6e6e8;
  border-radius:12px;
  overflow:hidden;
  background:#fafafa;
}
#waveCanvas{width:100%;height:100%;display:block}
.wave-playhead{
  position:absolute;
  top:0;bottom:0;
  left:0;
  width:2px;
  background:#111;
  pointer-events:none;
  transform:translateX(0);
}
.wave-label{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:#777}
.split-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.split-controls button{flex:1;min-width:110px}
@media(max-width:640px){
 .urlrow{grid-template-columns:1fr}
 .grid{grid-template-columns:1fr}
 .grid textarea{grid-column:auto}
}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="wrap">
<h1>YouTube 字幕编辑器 <span style="font-size:16px;color:#888;font-weight:500">21:24</span></h1>
<div class="version">重新稳定版 · 2026-08-16</div>

<div class="card">
  <b>1. 加载 YouTube</b>
  <div class="urlrow" style="margin-top:10px">
    <input id="ytUrl" type="text" placeholder="粘贴 YouTube / Shorts / youtu.be 链接">
    <button id="loadBtn">加载视频</button>
  </div>
  <div class="ytbox"><div id="player"></div></div>
  <div id="videoStatus" class="status">请先粘贴 YouTube 链接</div>
</div>

<div class="card">
  <b>2. 导入字幕</b>
  <div class="row" style="margin-top:10px">
    <label class="filebtn">＋ 导入 SRT / VTT<input id="srtFile" type="file" accept="*/*"></label>
    <button class="secondary" id="addSub">＋ 添加一条</button>
  </div>
  <div id="subStatus" class="status">尚未导入字幕</div>
</div>

<div class="card">
  <div id="currentSubtitle" class="subtitle">字幕会显示在这里</div>
  <div id="currentMeta" class="small" style="text-align:center">0 / 0</div>

  <div class="controls">
    <button class="secondary needsPlayer" id="rewind">⏪ 快退</button>
    <button class="needsPlayer" id="togglePlay">▶️ 播放</button>
    <button class="secondary needsPlayer" id="forward">快进 ⏩</button>
  </div>

  <div class="row" style="margin-top:10px">
    <label style="flex:1">快退/快进：
      <select id="seekStep"></select>
    </label>
    <label style="flex:1">播放速度：
      <select id="speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2.0×</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <button class="secondary needsPlayer" id="prev">上一句</button>
    <button class="needsPlayer" id="playCurrent">播放本句</button>
    <button class="secondary needsPlayer" id="next">下一句</button>
  </div>
  <div class="small" style="text-align:center;margin-top:6px">播放本句：到本句结束时间自动暂停</div>

  <div class="wave-wrap">
    <div class="wave-stage">
      <canvas id="waveCanvas"></canvas>
      <div id="wavePlayhead" class="wave-playhead"></div>
    </div>
    <div class="wave-label">
      <span id="waveStart">00:00.000</span>
      <span id="waveNow">00:00.000</span>
      <span id="waveEnd">00:00.000</span>
    </div>
    <div class="split-controls">
      <button class="secondary needsPlayer" id="splitBtn">✂️ 分割当前字幕</button>
    </div>
    <div class="small" style="margin-top:6px;text-align:center">
      竖线会按当前播放进度移动；分割后，当前字幕会按播放位置拆成两段，并自动重新编号排序。
    </div>
  </div>
</div>

<div class="card">
  <div class="row">
    <b style="flex:1">3. 编辑字幕</b>
    <button id="exportBtn">导出 SRT</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label>每次加减：
      <select id="msStep"></select>
      毫秒
    </label>
  </div>
  <div id="list"></div>
</div>
</div>

<script>
"use strict";

let player = null;
let playerReady = false;
let subs = [];
let current = 0;
let playSentenceMode = false;
let monitorTimer = null;
let suppressAutoUntil = 0;
let waveAnim = null;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = (n,l=2)=>String(n).padStart(l,"0");

for(let i=1;i<=10;i++){
  const o=document.createElement("option");
  o.value=i; o.textContent=i+" 秒";
  if(i===5)o.selected=true;
  $("#seekStep").appendChild(o);
}
for(let i=1;i<=100;i++){
  const o=document.createElement("option");
  o.value=i; o.textContent=i;
  if(i===10)o.selected=true;
  $("#msStep").appendChild(o);
}

function fmtShort(sec){
  sec=Math.max(0,Number(sec)||0);
  const m=Math.floor(sec/60);
  const s=Math.floor(sec%60);
  const ms=Math.floor((sec-Math.floor(sec))*1000);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;
}

function drawWaveform(){
  const canvas=$("#waveCanvas");
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(1,Math.floor(rect.width*dpr));
  const h=Math.max(1,Math.floor(rect.height*dpr));
  if(canvas.width!==w||canvas.height!==h){
    canvas.width=w;canvas.height=h;
  }
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.scale(dpr,dpr);
  const cw=rect.width,ch=rect.height;
  const mid=ch/2;

  // Draw a lightweight pseudo-waveform. YouTube iframe does not expose raw audio samples,
  // so this visual is progress-oriented rather than a true decoded waveform.
  for(let x=2;x<cw;x+=5){
    const a = 0.22 + 0.16*Math.sin(x*0.13) + 0.12*Math.sin(x*0.047+1.7);
    const amp = Math.max(5,Math.min(ch*0.42, ch*(0.18+Math.abs(a))));
    ctx.beginPath();
    ctx.moveTo(x,mid-amp);
    ctx.lineTo(x,mid+amp);
    ctx.stroke();
  }
  ctx.restore();
}

function updateWaveProgress(){
  const stage=document.querySelector(".wave-stage");
  if(!stage)return;
  const dur=(playerReady&&player&&player.getDuration)?Number(player.getDuration())||0:0;
  const t=playerReady?now():0;
  const pct=dur>0?Math.max(0,Math.min(1,t/dur)):0;
  $("#wavePlayhead").style.left=(pct*100)+"%";
  $("#waveStart").textContent="00:00.000";
  $("#waveNow").textContent=fmtShort(t);
  $("#waveEnd").textContent=fmtShort(dur);
}

function startWaveAnimation(){
  if(waveAnim)cancelAnimationFrame(waveAnim);
  const loop=()=>{
    updateWaveProgress();
    waveAnim=requestAnimationFrame(loop);
  };
  loop();
}

function setPlayerEnabled(on){
  $$(".needsPlayer").forEach(b=>b.disabled=!on);
}
setPlayerEnabled(false);

function extractId(input){
  const s=(input||"").trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  try{
    const u=new URL(s);
    const host=u.hostname.replace(/^www\./,"");
    if(host==="youtu.be") return u.pathname.split("/").filter(Boolean)[0]||null;
    if(host.endsWith("youtube.com")){
      if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||null;
      if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2]||null;
      return u.searchParams.get("v");
    }
  }catch(e){}
  return null;
}

window.onYouTubeIframeAPIReady = function(){
  $("#videoStatus").textContent = "YouTube 播放器已准备，可粘贴链接";
};

function createOrLoadVideo(id){
  playSentenceMode=false;
  if(player && typeof player.loadVideoById==="function"){
    player.loadVideoById(id);
    $("#videoStatus").textContent="正在加载视频…";
    return;
  }
  player = new YT.Player("player",{
    videoId:id,
    playerVars:{
      playsinline:1,
      rel:0,
      modestbranding:1,
      origin:location.origin
    },
    events:{
      onReady:function(){
        playerReady=true;
        setPlayerEnabled(true);
        $("#videoStatus").textContent="视频已加载";
        applySpeed();
        startMonitor();
        drawWaveform();
        startWaveAnimation();
      },
      onStateChange:function(e){
        $("#togglePlay").textContent =
          e.data===YT.PlayerState.PLAYING ? "⏸ 暂停" : "▶️ 播放";
      },
      onError:function(e){
        playerReady=false;
        setPlayerEnabled(false);
        $("#videoStatus").textContent="视频无法嵌入播放（错误 "+e.data+"）";
      }
    }
  });
}

$("#loadBtn").onclick = function(){
  const id=extractId($("#ytUrl").value);
  if(!id){
    alert("没有识别到有效的 YouTube 链接");
    return;
  }
  if(!(window.YT && YT.Player)){
    $("#videoStatus").textContent="YouTube 播放器还在加载，请过1秒再点一次";
    return;
  }
  createOrLoadVideo(id);
};

function now(){
  if(!playerReady || !player || typeof player.getCurrentTime!=="function") return 0;
  return Number(player.getCurrentTime())||0;
}
function seek(t){
  if(playerReady && player) player.seekTo(Math.max(0,Number(t)||0),true);
}
function play(){
  if(playerReady && player) player.playVideo();
}
function pause(){
  if(playerReady && player) player.pauseVideo();
}
function isPlaying(){
  return !!(playerReady && player && player.getPlayerState()===YT.PlayerState.PLAYING);
}

function applySpeed(){
  if(!playerReady || !player)return;
  const wanted=Number($("#speed").value)||1;
  const rates=player.getAvailablePlaybackRates ? player.getAvailablePlaybackRates() : [];
  if(rates && rates.length){
    let best=rates[0];
    for(const r of rates){
      if(Math.abs(r-wanted)<Math.abs(best-wanted))best=r;
    }
    player.setPlaybackRate(best);
  }
}
$("#speed").onchange=applySpeed;
window.addEventListener("resize",drawWaveform);

$("#rewind").onclick=function(){
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+500;
  seek(now()-(Number($("#seekStep").value)||5));
};
$("#forward").onclick=function(){
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+500;
  seek(now()+(Number($("#seekStep").value)||5));
};
$("#togglePlay").onclick=function(){
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+300;
  if(isPlaying())pause(); else play();
};

function parseTime(t){
  t=String(t||"").trim();
  let m=t.match(/^(\d+):(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
  if(!m){
    m=t.match(/^(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
    if(m){
      const mm=Number(m[1]),ss=Number(m[2]),ms=Number(String(m[3]).padEnd(3,"0"));
      return mm*60+ss+ms/1000;
    }
    return 0;
  }
  const h=Number(m[1]),mi=Number(m[2]),s=Number(m[3]);
  const ms=Number(String(m[4]).padEnd(3,"0"));
  return h*3600+mi*60+s+ms/1000;
}

function fmt(sec){
  let total=Math.round(Math.max(0,Number(sec)||0)*1000);
  const h=Math.floor(total/3600000); total-=h*3600000;
  const m=Math.floor(total/60000); total-=m*60000;
  const s=Math.floor(total/1000); total-=s*1000;
  return `${pad(h)}:${pad(m)}:${pad(s)},${pad(total,3)}`;
}

function parseSubs(text){
  let t=text.replace(/^\uFEFF/,"").replace(/\r/g,"").trim();
  if(/^WEBVTT/i.test(t)){
    t=t.replace(/^WEBVTT[^\n]*\n+/i,"")
       .replace(/(\d{2}:\d{2}:\d{2})\.(\d{3})/g,"$1,$2")
       .replace(/(\d{2}:\d{2})\.(\d{3})/g,"00:$1,$2");
  }
  return t.split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n");
    const ti=lines.findIndex(x=>x.includes("-->"));
    if(ti<0)return null;
    const parts=lines[ti].split("-->");
    return {
      start:parseTime(parts[0]),
      end:parseTime(parts[1]),
      text:lines.slice(ti+1).join("\n")
    };
  }).filter(Boolean);
}

$("#srtFile").onchange=async function(e){
  const f=e.target.files && e.target.files[0];
  if(!f)return;
  $("#subStatus").textContent="正在读取字幕…";
  try{
    const buf=await f.arrayBuffer();
    let text=new TextDecoder("utf-8").decode(buf);
    let parsed=parseSubs(text);
    if(!parsed.length){
      try{
        text=new TextDecoder("gb18030").decode(buf);
        parsed=parseSubs(text);
      }catch(_){}
    }
    if(!parsed.length){
      $("#subStatus").textContent="没有识别到字幕";
      alert("没有识别到 SRT/VTT 字幕");
      e.target.value="";
      return;
    }
    subs=parsed;
    current=0;
    $("#subStatus").textContent=`已导入 ${subs.length} 条：${f.name}`;
    renderAll();
    e.target.value="";
  }catch(err){
    console.error(err);
    $("#subStatus").textContent="字幕读取失败";
    alert("字幕读取失败");
  }
};

$("#addSub").onclick=function(){
  const st=playerReady?now():0;
  subs.push({start:st,end:st+2,text:""});
  current=subs.length-1;
  renderAll();
};

function updateTop(){
  $("#currentMeta").textContent=subs.length?`${current+1} / ${subs.length}`:"0 / 0";
  $("#currentSubtitle").textContent=subs[current]?.text||"字幕会显示在这里";
  $$("#list .item").forEach((el,i)=>el.classList.toggle("active",i===current));
}

function renderAll(){
  updateTop();
  $("#list").innerHTML=subs.map((s,i)=>`
    <div class="item ${i===current?'active':''}" data-row="${i}">
      <div class="small" style="font-weight:600;margin-bottom:6px">第 ${i+1} 段</div>
      <div class="grid">
        <div>
          <div class="small">开始时间</div>
          <input class="timeinput" data-time="start" data-i="${i}" value="${fmt(s.start)}">
          <div class="timebox" style="margin-top:6px">
            <button onclick="adjust(${i},'start',-1)">－</button>
            <div class="small" style="text-align:center">毫秒</div>
            <button onclick="adjust(${i},'start',1)">＋</button>
          </div>
        </div>
        <div>
          <div class="small">结束时间</div>
          <input class="timeinput" data-time="end" data-i="${i}" value="${fmt(s.end)}">
          <div class="timebox" style="margin-top:6px">
            <button onclick="adjust(${i},'end',-1)">－</button>
            <div class="small" style="text-align:center">毫秒</div>
            <button onclick="adjust(${i},'end',1)">＋</button>
          </div>
        </div>
        <textarea data-text="${i}">${escapeHtml(s.text)}</textarea>
      </div>
      <div class="controls">
        <button class="secondary" onclick="locate(${i})">定位</button>
        <button class="secondary" onclick="removeSub(${i})">删除</button>
      </div>
    </div>
  `).join("");

  $$("[data-text]").forEach(el=>{
    el.oninput=function(){
      const i=Number(el.dataset.text);
      subs[i].text=el.value;
      if(i===current)$("#currentSubtitle").textContent=el.value;
    };
  });
  $$("[data-time]").forEach(el=>{
    el.onchange=function(){
      const i=Number(el.dataset.i), field=el.dataset.time;
      subs[i][field]=parseTime(el.value);
      el.value=fmt(subs[i][field]);
    };
  });
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

window.adjust=function(i,field,dir){
  const step=(Number($("#msStep").value)||10)/1000;
  subs[i][field]=Math.max(0,Math.round((subs[i][field]+dir*step)*1000)/1000);
  current=i;
  renderAll();
};

window.locate=function(i){
  if(!subs.length)return;
  playSentenceMode=false;
  current=i;
  suppressAutoUntil=Date.now()+700;
  updateTop();
  seek(subs[i].start);
};

window.removeSub=function(i){
  subs.splice(i,1);
  current=Math.min(current,Math.max(0,subs.length-1));
  renderAll();
};

function playSelectedSentence(){
  if(!playerReady||!subs.length)return;
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+2000;
  pause();
  const target=subs[current].start;
  seek(target);
  setTimeout(function(){
    playSentenceMode=true;
    play();
  },250);
}

$("#prev").onclick=function(){
  if(!playerReady||!subs.length)return;
  current=Math.max(0,current-1);
  updateTop();
  playSelectedSentence();
};

$("#next").onclick=function(){
  if(!playerReady||!subs.length)return;
  current=Math.min(subs.length-1,current+1);
  updateTop();
  playSelectedSentence();
};

$("#playCurrent").onclick=function(){
  playSelectedSentence();
};

function startMonitor(){
  if(monitorTimer)clearInterval(monitorTimer);
  monitorTimer=setInterval(function(){
    if(!playerReady||!subs.length)return;
    const t=now();

    if(playSentenceMode){
      if(t>=subs[current].end-0.025){
        pause();
        seek(subs[current].end);
        playSentenceMode=false;
        suppressAutoUntil=Date.now()+1000;
      }
      return;
    }

    if(Date.now()<suppressAutoUntil)return;

    // Only follow subtitles while the YouTube video is actually playing continuously.
    if(!isPlaying())return;

    const i=subs.findIndex(s=>t>=s.start&&t<=s.end);
    if(i>=0&&i!==current){
      current=i;
      updateTop();
    }
  },150);
}


$("#splitBtn").onclick=function(){
  if(!playerReady||!subs.length)return;
  const t=now();
  const s=subs[current];

  if(!(t>s.start+0.03 && t<s.end-0.03)){
    alert("请把播放位置放在当前字幕的中间位置再分割。");
    return;
  }

  playSentenceMode=false;
  pause();

  const originalText=String(s.text||"").trim();
  let firstText=originalText, secondText=originalText;

  // If there are multiple lines, split text near the middle; otherwise duplicate the text
  // so the user can edit each half after timing split.
  const lines=originalText.split("\n").filter(Boolean);
  if(lines.length>=2){
    const cut=Math.ceil(lines.length/2);
    firstText=lines.slice(0,cut).join("\n");
    secondText=lines.slice(cut).join("\n");
  }

  const first={start:s.start,end:t,text:firstText};
  const second={start:t,end:s.end,text:secondText};

  subs.splice(current,1,first,second);

  // Sort by time and automatically renumber via array order.
  subs.sort((a,b)=>a.start-b.start || a.end-b.end);

  current=subs.findIndex(x=>x===second);
  if(current<0) current=0;

  renderAll();
  seek(subs[current].start);
  $("#subStatus").textContent=`已分割字幕，共 ${subs.length} 条，并已自动重新排序`;
};

$("#exportBtn").onclick=function(){
  if(!subs.length){alert("没有字幕");return}
  const text=subs.map((s,i)=>`${i+1}\n${fmt(s.start)} --> ${fmt(s.end)}\n${s.text.trim()}\n`).join("\n");
  const blob=new Blob([text],{type:"application/x-subrip;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="修改后的字幕.srt";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

renderAll();
</script>
</body>
</html>
