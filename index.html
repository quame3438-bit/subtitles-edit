<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>YouTube 字幕编辑器</title>
<style>
*{box-sizing:border-box}
html,body{touch-action:manipulation}
body{margin:0;background:#f5f5f7;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:820px;margin:auto;padding:14px 12px 40px}
h1{font-size:24px;margin:8px 0 4px}
.version{font-size:12px;color:#888;margin-bottom:10px}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.controls button{flex:1;min-width:88px}
button,.filebtn{border:0;border-radius:12px;padding:11px 13px;background:#111;color:#fff;font-size:15px;text-align:center}
button.secondary,.filebtn.secondary{background:#eee;color:#222}
button:disabled{opacity:.45}
input[type=file]{display:none}
input[type=text],textarea,select{width:100%;border:1px solid #d7d7db;border-radius:10px;padding:10px;font-size:15px;background:#fff}
.urlrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.ytbox{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-top:12px}
#player{width:100%;height:100%}
.small{font-size:13px;color:#777}
.subtitle{font-size:22px;font-weight:600;text-align:center;min-height:58px;padding:12px 8px;white-space:pre-wrap}
.subtitle-wrap{position:relative;min-height:58px}
.subtitle-cover{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  border-radius:12px;background:#222;color:#fff;font-size:16px;font-weight:600;z-index:3;
  user-select:none;-webkit-user-select:none
}
.subtitle-wrap.covered .subtitle-cover{display:flex}
.subtitle-strip{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;
  padding:10px 4px 14px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch
}
.item{
  flex:0 0 min(88vw,520px);
  border:1px solid #e6e6e8;border-radius:14px;padding:10px;
  scroll-snap-align:center;background:#fff
}
.item.active{outline:2px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid textarea{grid-column:1/-1;min-height:82px;resize:vertical}
.timebox{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center}
.timebox button{padding:10px 0;background:#eee;color:#222;font-size:18px}
.timeinput{font-variant-numeric:tabular-nums;text-align:center}
.status{margin-top:8px;font-size:13px;color:#777}
.segment-times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.segment-time{background:#f7f7f8;border-radius:12px;padding:10px;text-align:center}
.segment-time b{display:block;font-variant-numeric:tabular-nums;margin-top:4px}
.segment-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;-webkit-overflow-scrolling:touch}
.segment-chip{flex:0 0 auto;background:#eee;color:#222;border-radius:12px;padding:10px 12px}
.segment-chip.active{background:#111;color:#fff}
.segment-actions{display:flex;gap:8px;margin-top:8px}
.segment-actions button{flex:1}
@media(max-width:640px){
 .urlrow{grid-template-columns:1fr}
 .item{flex-basis:88vw}
 .grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .grid textarea{grid-column:1/-1}
}
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<div class="wrap">
<h1>YouTube 字幕编辑器 <span style="font-size:16px;color:#888;font-weight:500">22:48</span></h1>
<div class="version">自定义视频分段版 · 保存分段版</div>

<div class="card">
  <b>1. 加载 YouTube</b>
  <div class="urlrow" style="margin-top:10px">
    <input id="ytUrl" type="text" placeholder="粘贴 YouTube / Shorts / youtu.be 链接">
    <button id="loadBtn">加载视频</button>
  </div>
  <div class="ytbox"><div id="player"></div></div>
  <div id="videoStatus" class="status">请先粘贴 YouTube 链接</div>
</div>

<div class="card">
  <b>2. 导入字幕</b>
  <div class="row" style="margin-top:10px">
    <label class="filebtn">＋ 导入 SRT / VTT<input id="srtFile" type="file" accept="*/*"></label>
    <button class="secondary" id="addSub">＋ 添加一条</button>
  </div>
  <div id="subStatus" class="status">尚未导入字幕</div>
</div>

<div class="card">
  <div id="subtitleWrap" class="subtitle-wrap">
    <div id="currentSubtitle" class="subtitle">字幕会显示在这里</div>
    <div id="subtitleCover" class="subtitle-cover">字幕已遮盖 · 点这里查看</div>
  </div>
  <div id="currentMeta" class="small" style="text-align:center">0 / 0</div>
  <div class="controls">
    <button class="secondary" id="coverBtn">遮盖字幕</button>
  </div>

  <div class="controls">
    <button class="secondary needsPlayer" id="rewind">⏪ 快退</button>
    <button class="needsPlayer" id="togglePlay">▶️ 播放</button>
    <button class="secondary needsPlayer" id="forward">快进 ⏩</button>
  </div>

  <div class="row" style="margin-top:10px">
    <label style="flex:1">快退/快进：
      <select id="seekStep"></select>
    </label>
    <label style="flex:1">播放速度：
      <select id="speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2.0×</option>
      </select>
    </label>
  </div>

  <div class="controls">
    <button class="secondary needsPlayer" id="prev">上一句</button>
    <button class="needsPlayer" id="playCurrent">播放本句</button>
    <button class="secondary needsPlayer" id="next">下一句</button>
  </div>

  <div class="controls">
    <button class="secondary needsPlayer" id="prevSegment">上一段</button>
    <button class="needsPlayer" id="playSegment">播放本段</button>
    <button class="secondary needsPlayer" id="nextSegment">下一段</button>
  </div>

  <div class="small" style="text-align:center;margin-top:6px">
    播放本句：按字幕时间播放并自动暂停；播放本段：按自定义视频分段播放并自动暂停
  </div>

</div>

<div class="card">
  <b>3. 自定义视频分段</b>
  <div class="small" style="margin-top:5px">和字幕时间完全独立。把视频停到需要的位置，分别设置开始点和结束点。</div>

  <div class="segment-times">
    <div class="segment-time">开始时间<b id="segStartText">未设置</b></div>
    <div class="segment-time">结束时间<b id="segEndText">未设置</b></div>
  </div>

  <div class="controls">
    <button class="secondary needsPlayer" id="setSegStart">设为开始点</button>
    <button class="secondary needsPlayer" id="setSegEnd">设为结束点</button>
  </div>
  <div class="controls">
    <button class="needsPlayer" id="addSegment">＋ 添加此段</button>
    <button class="secondary" id="saveSegments">保存分段</button>
  </div>
  <div class="controls">
    <button class="secondary" id="exportSegments">导出分段</button>
    <label class="filebtn secondary" style="flex:1">导入分段
      <input id="importSegmentsFile" type="file" accept=".json,application/json">
    </label>
  </div>

  <div id="segmentStrip" class="segment-strip"></div>
  <div id="segmentStatus" class="status">还没有自定义视频段落</div>
</div>

<div class="card">
  <div class="row">
    <b style="flex:1">4. 编辑字幕</b>
    <button id="exportBtn">导出 SRT</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label>每次加减：
      <select id="msStep"></select>
      毫秒
    </label>
  </div>
  <div id="list" class="subtitle-strip"></div>
</div>
</div>

<script>
"use strict";

let player = null;
let playerReady = false;
let subs = [];
let current = 0;
let playSentenceMode = false;
let monitorTimer = null;
let suppressAutoUntil = 0;
let subtitleCovered = false;
let videoSegments = [];
let segmentStart = null;
let segmentEnd = null;
let playingSegmentIndex = -1;
let selectedSegmentIndex = -1;
let segmentPlayMode = false;

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = (n,l=2)=>String(n).padStart(l,"0");

for(let i=1;i<=10;i++){
  const o=document.createElement("option");
  o.value=i; o.textContent=i+" 秒";
  if(i===5)o.selected=true;
  $("#seekStep").appendChild(o);
}
for(let i=1;i<=100;i++){
  const o=document.createElement("option");
  o.value=i; o.textContent=i;
  if(i===10)o.selected=true;
  $("#msStep").appendChild(o);
}

function setSubtitleCover(on){
  subtitleCovered=!!on;
  const wrap=$("#subtitleWrap");
  if(wrap) wrap.classList.toggle("covered",subtitleCovered);
  const btn=$("#coverBtn");
  if(btn) btn.textContent=subtitleCovered ? "显示字幕" : "遮盖字幕";
}
document.addEventListener("click",function(e){
  if(e.target && e.target.id==="coverBtn") setSubtitleCover(!subtitleCovered);
  if(e.target && e.target.id==="subtitleCover") setSubtitleCover(false);
});

function setPlayerEnabled(on){
  $$(".needsPlayer").forEach(b=>b.disabled=!on);
}
setPlayerEnabled(false);

function extractId(input){
  const s=(input||"").trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
  try{
    const u=new URL(s);
    const host=u.hostname.replace(/^www\./,"");
    if(host==="youtu.be") return u.pathname.split("/").filter(Boolean)[0]||null;
    if(host.endsWith("youtube.com")){
      if(u.pathname.startsWith("/shorts/")) return u.pathname.split("/")[2]||null;
      if(u.pathname.startsWith("/embed/")) return u.pathname.split("/")[2]||null;
      return u.searchParams.get("v");
    }
  }catch(e){}
  return null;
}

window.onYouTubeIframeAPIReady = function(){
  $("#videoStatus").textContent = "YouTube 播放器已准备，可粘贴链接";
};

function createOrLoadVideo(id){
  playSentenceMode=false;
  if(player && typeof player.loadVideoById==="function"){
    player.loadVideoById(id);
    $("#videoStatus").textContent="正在加载视频…";
    return;
  }
  player = new YT.Player("player",{
    videoId:id,
    playerVars:{
      playsinline:1,
      rel:0,
      modestbranding:1,
      origin:location.origin
    },
    events:{
      onReady:function(){
        playerReady=true;
        setPlayerEnabled(true);
        $("#videoStatus").textContent="视频已加载";
        applySpeed();
        startMonitor();
        loadSegmentsFromLocal();
      },
      onStateChange:function(e){
        $("#togglePlay").textContent =
          e.data===YT.PlayerState.PLAYING ? "⏸ 暂停" : "▶️ 播放";
      },
      onError:function(e){
        playerReady=false;
        setPlayerEnabled(false);
        $("#videoStatus").textContent="视频无法嵌入播放（错误 "+e.data+"）";
      }
    }
  });
}

$("#loadBtn").onclick = function(){
  const id=extractId($("#ytUrl").value);
  if(!id){
    alert("没有识别到有效的 YouTube 链接");
    return;
  }
  if(!(window.YT && YT.Player)){
    $("#videoStatus").textContent="YouTube 播放器还在加载，请过1秒再点一次";
    return;
  }
  createOrLoadVideo(id);
};

function now(){
  if(!playerReady || !player || typeof player.getCurrentTime!=="function") return 0;
  return Number(player.getCurrentTime())||0;
}
function seek(t){
  if(playerReady && player) player.seekTo(Math.max(0,Number(t)||0),true);
}
function play(){
  if(playerReady && player) player.playVideo();
}
function pause(){
  if(playerReady && player) player.pauseVideo();
}
function isPlaying(){
  return !!(playerReady && player && player.getPlayerState()===YT.PlayerState.PLAYING);
}

function applySpeed(){
  if(!playerReady || !player)return;
  const wanted=Number($("#speed").value)||1;
  const rates=player.getAvailablePlaybackRates ? player.getAvailablePlaybackRates() : [];
  if(rates && rates.length){
    let best=rates[0];
    for(const r of rates){
      if(Math.abs(r-wanted)<Math.abs(best-wanted))best=r;
    }
    player.setPlaybackRate(best);
  }
}
$("#speed").onchange=applySpeed;

$("#rewind").onclick=function(){
  cancelSegmentPlay();
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+500;
  seek(now()-(Number($("#seekStep").value)||5));
};
$("#forward").onclick=function(){
  cancelSegmentPlay();
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+500;
  seek(now()+(Number($("#seekStep").value)||5));
};
$("#togglePlay").onclick=function(){
  cancelSegmentPlay();
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+300;
  if(isPlaying())pause(); else play();
};

function fmtSegmentTime(sec){
  sec=Math.max(0,Number(sec)||0);
  const m=Math.floor(sec/60);
  const s=Math.floor(sec%60);
  const ms=Math.floor((sec-Math.floor(sec))*1000);
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}.${String(ms).padStart(3,"0")}`;
}

function cancelSegmentPlay(){
  segmentPlayMode=false;
  playingSegmentIndex=-1;
  renderSegments();
}

function renderSegments(){
  const strip=$("#segmentStrip");
  if(!strip)return;
  strip.innerHTML=videoSegments.map((seg,i)=>`
    <div>
      <button class="segment-chip ${i===selectedSegmentIndex?'active':''}" onclick="selectVideoSegment(${i})">
        第${i+1}段<br>${fmtSegmentTime(seg.start)} → ${fmtSegmentTime(seg.end)}
      </button>
      <div class="segment-actions">
        <button class="secondary" onclick="editVideoSegment(${i})">修改</button>
        <button class="secondary" onclick="deleteVideoSegment(${i})">删除</button>
      </div>
    </div>
  `).join("");
  $("#segmentStatus").textContent=videoSegments.length
    ? `共 ${videoSegments.length} 个自定义段落 · 点击段落即可播放`
    : "还没有自定义视频段落";
}

$("#setSegStart").onclick=function(){
  if(!playerReady)return;
  segmentStart=now();
  $("#segStartText").textContent=fmtSegmentTime(segmentStart);
};

$("#setSegEnd").onclick=function(){
  if(!playerReady)return;
  segmentEnd=now();
  $("#segEndText").textContent=fmtSegmentTime(segmentEnd);
};

$("#addSegment").onclick=function(){
  if(segmentStart===null || segmentEnd===null){
    alert("请先设置开始点和结束点");
    return;
  }
  if(segmentEnd<=segmentStart){
    alert("结束时间必须晚于开始时间");
    return;
  }
  videoSegments.push({start:segmentStart,end:segmentEnd});
  videoSegments.sort((a,b)=>a.start-b.start || a.end-b.end);
  if(selectedSegmentIndex<0 && videoSegments.length) selectedSegmentIndex=0;
  segmentStart=null;
  segmentEnd=null;
  $("#segStartText").textContent="未设置";
  $("#segEndText").textContent="未设置";
  renderSegments();
};

window.selectVideoSegment=function(i){
  if(!videoSegments[i])return;
  selectedSegmentIndex=i;
  playingSegmentIndex=-1;
  segmentPlayMode=false;
  pause();
  seek(videoSegments[i].start);
  renderSegments();
};

function playSelectedSegment(){
  if(!playerReady || selectedSegmentIndex<0 || !videoSegments[selectedSegmentIndex])return;
  playSentenceMode=false;
  segmentPlayMode=false;
  pause();

  playingSegmentIndex=selectedSegmentIndex;
  const seg=videoSegments[selectedSegmentIndex];
  seek(seg.start);
  renderSegments();

  setTimeout(function(){
    segmentPlayMode=true;
    play();
  },250);
}

$("#playSegment").onclick=function(){
  playSelectedSegment();
};

$("#prevSegment").onclick=function(){
  if(!videoSegments.length)return;
  if(selectedSegmentIndex<0) selectedSegmentIndex=0;
  else selectedSegmentIndex=Math.max(0,selectedSegmentIndex-1);
  renderSegments();
  playSelectedSegment();
};

$("#nextSegment").onclick=function(){
  if(!videoSegments.length)return;
  if(selectedSegmentIndex<0) selectedSegmentIndex=0;
  else selectedSegmentIndex=Math.min(videoSegments.length-1,selectedSegmentIndex+1);
  renderSegments();
  playSelectedSegment();
};

window.deleteVideoSegment=function(i){
  if(i===playingSegmentIndex){
    pause();
    cancelSegmentPlay();
  }
  videoSegments.splice(i,1);
  if(selectedSegmentIndex>i) selectedSegmentIndex--;
  if(selectedSegmentIndex>=videoSegments.length) selectedSegmentIndex=videoSegments.length-1;
  if(!videoSegments.length) selectedSegmentIndex=-1;
  if(playingSegmentIndex>i) playingSegmentIndex--;
  renderSegments();
};

window.editVideoSegment=function(i){
  const seg=videoSegments[i];
  if(!seg)return;
  segmentStart=seg.start;
  segmentEnd=seg.end;
  $("#segStartText").textContent=fmtSegmentTime(segmentStart);
  $("#segEndText").textContent=fmtSegmentTime(segmentEnd);
  videoSegments.splice(i,1);
  if(selectedSegmentIndex>=videoSegments.length) selectedSegmentIndex=videoSegments.length-1;
  renderSegments();
  $("#segmentStatus").textContent="已载入该段时间，重新设置后点“添加此段”";
};


function segmentStorageKey(){
  const id=extractId($("#ytUrl").value);
  return id ? "ytSegments:"+id : "ytSegments:default";
}

function saveSegmentsToLocal(){
  try{
    localStorage.setItem(segmentStorageKey(), JSON.stringify(videoSegments));
    $("#segmentStatus").textContent=`已保存 ${videoSegments.length} 个自定义段落`;
  }catch(e){
    alert("保存失败：浏览器本地存储不可用");
  }
}

function loadSegmentsFromLocal(){
  try{
    const raw=localStorage.getItem(segmentStorageKey());
    if(!raw)return;
    const arr=JSON.parse(raw);
    if(Array.isArray(arr)){
      videoSegments=arr
        .filter(x=>x && Number.isFinite(Number(x.start)) && Number.isFinite(Number(x.end)))
        .map(x=>({start:Number(x.start),end:Number(x.end)}))
        .filter(x=>x.end>x.start)
        .sort((a,b)=>a.start-b.start || a.end-b.end);
      selectedSegmentIndex=videoSegments.length ? 0 : -1;
      playingSegmentIndex=-1;
      renderSegments();
      if(videoSegments.length){
        $("#segmentStatus").textContent=`已恢复 ${videoSegments.length} 个已保存段落`;
      }
    }
  }catch(e){}
}

$("#saveSegments").onclick=function(){
  saveSegmentsToLocal();
};

$("#exportSegments").onclick=function(){
  if(!videoSegments.length){
    alert("现在没有分段可以导出");
    return;
  }
  const id=extractId($("#ytUrl").value) || "";
  const data={
    type:"youtube-segments",
    version:1,
    videoId:id,
    exportedAt:new Date().toISOString(),
    segments:videoSegments
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=(id?`分段_${id}`:"视频分段")+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  $("#segmentStatus").textContent=`已导出 ${videoSegments.length} 个分段`;
};

$("#importSegmentsFile").onchange=async function(e){
  const f=e.target.files && e.target.files[0];
  if(!f)return;
  try{
    const text=await f.text();
    const data=JSON.parse(text);
    const arr=Array.isArray(data) ? data : data.segments;

    if(!Array.isArray(arr)){
      throw new Error("bad format");
    }

    const cleaned=arr
      .filter(x=>x && Number.isFinite(Number(x.start)) && Number.isFinite(Number(x.end)))
      .map(x=>({start:Number(x.start),end:Number(x.end)}))
      .filter(x=>x.end>x.start)
      .sort((a,b)=>a.start-b.start || a.end-b.end);

    if(!cleaned.length){
      throw new Error("empty");
    }

    videoSegments=cleaned;
    selectedSegmentIndex=0;
    playingSegmentIndex=-1;
    segmentPlayMode=false;
    renderSegments();
    saveSegmentsToLocal();
    $("#segmentStatus").textContent=`已导入并保存 ${videoSegments.length} 个分段`;
  }catch(err){
    alert("导入失败：请选择这个网页导出的分段 JSON 文件");
  }finally{
    e.target.value="";
  }
};

function parseTime(t){
  t=String(t||"").trim();
  let m=t.match(/^(\d+):(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
  if(!m){
    m=t.match(/^(\d{1,2}):(\d{1,2})[,.](\d{1,3})$/);
    if(m){
      const mm=Number(m[1]),ss=Number(m[2]),ms=Number(String(m[3]).padEnd(3,"0"));
      return mm*60+ss+ms/1000;
    }
    return 0;
  }
  const h=Number(m[1]),mi=Number(m[2]),s=Number(m[3]);
  const ms=Number(String(m[4]).padEnd(3,"0"));
  return h*3600+mi*60+s+ms/1000;
}

function fmt(sec){
  let total=Math.round(Math.max(0,Number(sec)||0)*1000);
  const h=Math.floor(total/3600000); total-=h*3600000;
  const m=Math.floor(total/60000); total-=m*60000;
  const s=Math.floor(total/1000); total-=s*1000;
  return `${pad(h)}:${pad(m)}:${pad(s)},${pad(total,3)}`;
}

function parseSubs(text){
  let t=text.replace(/^\uFEFF/,"").replace(/\r/g,"").trim();
  if(/^WEBVTT/i.test(t)){
    t=t.replace(/^WEBVTT[^\n]*\n+/i,"")
       .replace(/(\d{2}:\d{2}:\d{2})\.(\d{3})/g,"$1,$2")
       .replace(/(\d{2}:\d{2})\.(\d{3})/g,"00:$1,$2");
  }
  return t.split(/\n\s*\n/).map(block=>{
    const lines=block.split("\n");
    const ti=lines.findIndex(x=>x.includes("-->"));
    if(ti<0)return null;
    const parts=lines[ti].split("-->");
    return {
      start:parseTime(parts[0]),
      end:parseTime(parts[1]),
      text:lines.slice(ti+1).join("\n")
    };
  }).filter(Boolean);
}

$("#srtFile").onchange=async function(e){
  const f=e.target.files && e.target.files[0];
  if(!f)return;
  $("#subStatus").textContent="正在读取字幕…";
  try{
    const buf=await f.arrayBuffer();
    let text=new TextDecoder("utf-8").decode(buf);
    let parsed=parseSubs(text);
    if(!parsed.length){
      try{
        text=new TextDecoder("gb18030").decode(buf);
        parsed=parseSubs(text);
      }catch(_){}
    }
    if(!parsed.length){
      $("#subStatus").textContent="没有识别到字幕";
      alert("没有识别到 SRT/VTT 字幕");
      e.target.value="";
      return;
    }
    subs=parsed;
    current=0;
    $("#subStatus").textContent=`已导入 ${subs.length} 条：${f.name}`;
    renderAll();
    e.target.value="";
  }catch(err){
    console.error(err);
    $("#subStatus").textContent="字幕读取失败";
    alert("字幕读取失败");
  }
};

$("#addSub").onclick=function(){
  const st=playerReady?now():0;
  subs.push({start:st,end:st+2,text:""});
  current=subs.length-1;
  renderAll();
};

function centerCurrentCard(){
  const strip=$("#list");
  const card=strip ? strip.querySelector(`[data-row="${current}"]`) : null;
  if(!strip || !card) return;
  const left=card.offsetLeft-(strip.clientWidth-card.clientWidth)/2;
  strip.scrollTo({left:Math.max(0,left),behavior:"smooth"});
}
function updateTop(){
  $("#currentMeta").textContent=subs.length?`${current+1} / ${subs.length}`:"0 / 0";
  $("#currentSubtitle").textContent=subs[current]?.text||"字幕会显示在这里";
  $$("#list .item").forEach((el,i)=>el.classList.toggle("active",i===current));
  requestAnimationFrame(centerCurrentCard);
}

function renderAll(){
  updateTop();
  $("#list").innerHTML=subs.map((s,i)=>`
    <div class="item ${i===current?'active':''}" data-row="${i}">
      <div class="grid">
        <div>
          <div class="small">开始时间</div>
          <input class="timeinput" data-time="start" data-i="${i}" value="${fmt(s.start)}">
          <div class="timebox" style="margin-top:6px">
            <button onclick="adjust(${i},'start',-1)">－</button>
            <button onclick="adjust(${i},'start',1)">＋</button>
          </div>
        </div>
        <div>
          <div class="small">结束时间</div>
          <input class="timeinput" data-time="end" data-i="${i}" value="${fmt(s.end)}">
          <div class="timebox" style="margin-top:6px">
            <button onclick="adjust(${i},'end',-1)">－</button>
            <button onclick="adjust(${i},'end',1)">＋</button>
          </div>
        </div>
        <div class="small" style="grid-column:1/-1;margin-top:2px">编辑字幕</div>
        <textarea data-text="${i}">${escapeHtml(s.text)}</textarea>
      </div>
      <div class="controls">
        <button class="secondary" onclick="locate(${i})">定位</button>
        <button class="secondary" onclick="removeSub(${i})">删除</button>
      </div>
    </div>
  `).join("");

  $$("[data-text]").forEach(el=>{
    el.oninput=function(){
      const i=Number(el.dataset.text);
      subs[i].text=el.value;
      if(i===current)$("#currentSubtitle").textContent=el.value;
    };
  });
  $$("[data-time]").forEach(el=>{
    el.onchange=function(){
      const i=Number(el.dataset.i), field=el.dataset.time;
      subs[i][field]=parseTime(el.value);
      el.value=fmt(subs[i][field]);
    };
  });
  requestAnimationFrame(centerCurrentCard);
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

window.adjust=function(i,field,dir){
  const step=(Number($("#msStep").value)||10)/1000;
  subs[i][field]=Math.max(0,Math.round((subs[i][field]+dir*step)*1000)/1000);
  current=i;
  renderAll();
};

window.locate=function(i){
  if(!subs.length)return;
  playSentenceMode=false;
  current=i;
  suppressAutoUntil=Date.now()+700;
  updateTop();
  seek(subs[i].start);
};

window.removeSub=function(i){
  subs.splice(i,1);
  current=Math.min(current,Math.max(0,subs.length-1));
  renderAll();
};

function playSelectedSentence(){
  if(!playerReady||!subs.length)return;
  cancelSegmentPlay();
  playSentenceMode=false;
  suppressAutoUntil=Date.now()+2000;
  pause();
  const target=subs[current].start;
  seek(target);
  setTimeout(function(){
    playSentenceMode=true;
    play();
  },250);
}

$("#prev").onclick=function(){
  if(!playerReady||!subs.length)return;
  current=Math.max(0,current-1);
  updateTop();
  playSelectedSentence();
};

$("#next").onclick=function(){
  if(!playerReady||!subs.length)return;
  current=Math.min(subs.length-1,current+1);
  updateTop();
  playSelectedSentence();
};

$("#playCurrent").onclick=function(){
  playSelectedSentence();
};

function startMonitor(){
  if(monitorTimer)clearInterval(monitorTimer);
  monitorTimer=setInterval(function(){
    if(!playerReady||!subs.length)return;
    const t=now();

    if(segmentPlayMode && playingSegmentIndex>=0 && videoSegments[playingSegmentIndex]){
      const seg=videoSegments[playingSegmentIndex];
      if(t>=seg.end-0.025){
        pause();
        seek(seg.end);
        segmentPlayMode=false;
        renderSegments();
      }
      return;
    }

    if(playSentenceMode){
      if(t>=subs[current].end-0.025){
        pause();
        seek(subs[current].end);
        playSentenceMode=false;
        suppressAutoUntil=Date.now()+1000;
      }
      return;
    }

    if(Date.now()<suppressAutoUntil)return;

    // Only follow subtitles while the YouTube video is actually playing continuously.
    if(!isPlaying())return;

    const i=subs.findIndex(s=>t>=s.start&&t<=s.end);
    if(i>=0&&i!==current){
      current=i;
      updateTop();
    }
  },150);
}


$("#exportBtn").onclick=function(){
  if(!subs.length){alert("没有字幕");return}
  const text=subs.map((s,i)=>`${i+1}\n${fmt(s.start)} --> ${fmt(s.end)}\n${s.text.trim()}\n`).join("\n");
  const blob=new Blob([text],{type:"application/x-subrip;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download="修改后的字幕.srt";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

renderSegments();

let lastTouchEnd = 0;
document.addEventListener("touchend", function(e){
  const now = Date.now();
  if(now - lastTouchEnd <= 300){
    e.preventDefault();
  }
  lastTouchEnd = now;
}, {passive:false});

document.addEventListener("dblclick", function(e){
  e.preventDefault();
}, {passive:false});

renderAll();
</script>
</body>
</html>
