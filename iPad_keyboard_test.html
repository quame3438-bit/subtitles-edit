<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPad键盘检测</title><style>body{font-family:-apple-system,sans-serif;padding:20px;background:#f5f5f7}.c{background:#fff;padding:18px;border-radius:16px;margin-bottom:15px}.big{font-size:32px;font-weight:700}.r{font-size:18px;padding:6px 0}pre{white-space:pre-wrap;font-size:13px}</style></head><body tabindex="0"><div class="c"><h2>iPad 外接键盘检测</h2><p>直接按：0、1、3、←、→、↑、↓、空格</p></div><div class="c"><div>最后收到：</div><div class="big" id="last">等待按键……</div><div class="r">key：<b id="key">—</b></div><div class="r">code：<b id="code">—</b></div><div class="r">keyCode：<b id="kc">—</b></div><div class="r">location：<b id="loc">—</b></div></div><div class="c"><pre id="log">暂无记录</pre></div><script>let a=[];function f(e){e.preventDefault();last.textContent=e.key===" "?"空格":e.key;key.textContent=JSON.stringify(e.key);code.textContent=JSON.stringify(e.code);kc.textContent=e.keyCode;loc.textContent=e.location;a.unshift(e.type+" | key="+JSON.stringify(e.key)+" | code="+JSON.stringify(e.code)+" | keyCode="+e.keyCode+" | location="+e.location);log.textContent=a.slice(0,20).join("\n")}window.addEventListener("keydown",f,true);window.addEventListener("keyup",f,true);document.body.focus();</script></body></html>
